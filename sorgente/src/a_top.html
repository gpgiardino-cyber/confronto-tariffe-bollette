<title>Confronto tariffe bollette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: desktop = left rail with the 7 sections + content column; phone = sticky top bar (casa + "+ Bolletta"), content, bottom bar with 5 voci. Gas warm-blue, luce amber, as in the old app; meter readouts are the signature. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D9DFE6; --fg:#16202B; --muted:#5B6878;
  --gas:#2350D8; --gas-2:#5BA6E8; --luce:#D98A00; --luce-2:#E05A3A;
  --ok:#1C8A5A; --warn:#B7791F; --bad:#C2372D;
  --meter-bg:#141A21; --meter-fg:#F2F4F6; --meter-red:#E2402F; --meter-rim:#2A333D; --meter-mute:#9AA7B4;
  --chip:#E3E8EE; --focus:#2350D8; --rail:#E6EAEF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#161D25; --surface-2:#1C242E; --line:#2A3440; --fg:#E8EDF2; --muted:#93A1B1;
  --gas:#6A8CFF; --gas-2:#7FC4F5; --luce:#F2B233; --luce-2:#FF7A5C;
  --ok:#4CC38A; --warn:#E3A93B; --bad:#FF6B5E;
  --meter-bg:#06090C; --meter-fg:#F2F4F6; --meter-red:#FF5642; --meter-rim:#232C36; --meter-mute:#9AA7B4;
  --chip:#222B36; --focus:#7FA0FF; --rail:#111820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#161D25; --surface-2:#1C242E; --line:#2A3440; --fg:#E8EDF2; --muted:#93A1B1;
  --gas:#6A8CFF; --gas-2:#7FC4F5; --luce:#F2B233; --luce-2:#FF7A5C;
  --ok:#4CC38A; --warn:#E3A93B; --bad:#FF6B5E;
  --meter-bg:#06090C; --meter-fg:#F2F4F6; --meter-red:#FF5642; --meter-rim:#232C36; --meter-mute:#9AA7B4;
  --chip:#222B36; --focus:#7FA0FF; --rail:#111820; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:72ch}
.lead b{color:var(--fg)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--gas)}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.wrap{max-width:1180px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.1;display:block;white-space:nowrap}
.brand small{color:var(--muted);font-size:.78rem}
main.wrap{padding-block:22px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottom button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--fg)}
.bottom button[aria-current="page"] svg{color:var(--gas)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:26;width:56px;height:56px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:1.9rem;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.btn.btn-add{display:none}
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(8,12,16,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.sheet button{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:12px 6px;border-radius:10px;cursor:pointer;font-weight:600}
.sheet button:hover{background:var(--surface-2)}
.sheet button small{display:block;font-weight:400;color:var(--muted)}
.sheet svg{width:22px;height:22px;flex:none;color:var(--muted)}
@media (min-width:900px){
  .app{grid-template-columns:236px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));background:var(--rail);border-right:1px solid var(--line)}
  .rail .brand{margin:0 0 18px 6px}
  .rail button.nav{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
  .rail button.nav svg{width:20px;height:20px;flex:none}
  .rail button.nav:hover{background:var(--surface-2);color:var(--fg)}
  .rail button.nav[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .rail button.nav[aria-current="page"] svg{color:var(--gas)}
  .rail .grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:14px 10px 4px}
  .rail .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px}
  .top .brand{display:none}
  .top .wrap{justify-content:flex-end}
  .top .ctx{margin-right:auto}
  .bottom,.fab{display:none}
  .btn.btn-add{display:inline-flex}
  main.wrap{padding-bottom:64px}
}
.ctx{font-family:var(--f-display);font-weight:700;font-size:1rem;display:none}
@media (min-width:900px){.ctx{display:block}}

/* section heads */
section[data-sec]{display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.grid>*{min-width:0}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.casa-seg[hidden]{display:none}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:clamp(1.55rem,3vw,2.1rem);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.delta{font-size:.82rem;font-weight:600;display:inline-flex;gap:4px;align-items:center}
.delta.up{color:var(--bad)} .delta.down{color:var(--ok)}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--chip);margin-top:8px}
.split i{display:block;height:100%}

/* meters */
.meters{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.meter{background:var(--meter-bg);color:var(--meter-fg);border-radius:18px;padding:18px 20px;border:1px solid var(--meter-rim);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.meter::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
.meter .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--meter-mute);font-weight:600}
.meter .who{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.odo{display:flex;gap:4px;font-family:var(--f-mono);font-weight:700;font-size:clamp(1.5rem,5vw,2.1rem);align-items:center;flex-wrap:wrap}
.odo span{background:#000;color:var(--meter-fg);border:1px solid #2C353F;border-radius:6px;min-width:1.15em;text-align:center;padding:.12em .1em;box-shadow:inset 0 6px 8px -6px rgba(255,255,255,.18),inset 0 -6px 8px -6px rgba(255,255,255,.12);animation:roll .7s cubic-bezier(.2,.8,.2,1) both}
.odo span.red{background:var(--meter-red);color:#fff;border-color:transparent}
.odo em{font-style:normal;font-family:var(--f-body);font-size:.8rem;color:var(--meter-mute);margin-left:6px;font-weight:500}
@keyframes roll{from{transform:translateY(-35%);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.odo span{animation:none}}
.meter .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px dashed #2E3843;padding-top:12px}
.meter .facts b{display:block;font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums}
.meter .facts small{color:var(--meter-mute);font-size:.72rem}
.fasce{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px}
.fasce div{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.75rem;font-weight:700;color:#111;min-width:34px}
.meter .empty{color:var(--meter-mute);font-size:.9rem}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.gas{color:var(--gas)} .pill.luce{color:var(--luce)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.tag{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--focus)}
td.r,th.r{text-align:right}
.click tbody tr{cursor:pointer}
.click tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
td.wrapcell{white-space:normal;min-width:180px}

/* charts */
.chart{position:relative;height:280px}
.chart.sm{height:220px}
.chart.lg{height:340px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.keynum{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 14px;margin-bottom:10px}
.ph .sub{font-size:.85rem;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted)}
.item .amt{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .amt small{display:block;font-family:var(--f-body);font-weight:600}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.dot.gas{background:color-mix(in srgb,var(--gas) 16%,transparent);color:var(--gas)}
.dot.luce{background:color-mix(in srgb,var(--luce) 18%,transparent);color:var(--luce)}
.dot svg{width:18px;height:18px}
.only-wide{display:none}
@media (min-width:760px){.only-wide{display:block}.only-narrow{display:none}}

/* reminders */
.rem{display:flex;flex-direction:column;gap:10px}
.rem .r{display:grid;grid-template-columns:4px 1fr;gap:12px;align-items:stretch}
.rem .r i{border-radius:2px;background:var(--muted)}
.rem .r.warn i{background:var(--warn)} .rem .r.bad i{background:var(--bad)} .rem .r.info i{background:var(--gas-2)}
.rem .r b{display:block}
.rem .r span{font-size:.88rem;color:var(--muted)}
.rem .r button{margin-top:6px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.88rem;font-weight:600}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.9rem}
.notes li::marker{color:var(--luce)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;min-height:60px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gas)}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:9px 12px;font-size:.88rem}
.errbox{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:10px;padding:9px 12px;font-size:.88rem}
.okbox{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);border-radius:10px;padding:9px 12px;font-size:.88rem}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
.form label input,.form label select{width:100%}
.form .wide{grid-column:1/-1}
.form .calc input{background:var(--surface-2)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;min-width:0}
legend{font-size:.78rem;font-weight:700;color:var(--muted);padding:0 4px}
.checkline{display:flex;gap:8px;align-items:center;font-size:.88rem}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .top-l{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600}
.slider .top-l output{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* upload */
.drop{border:2px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--gas);background:color-mix(in srgb,var(--gas) 6%,var(--surface))}
.drop svg{width:44px;height:44px;color:var(--muted)}
.drop.alt{border-style:solid;background:var(--surface-2)}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.privacy svg{width:20px;height:20px;flex:none;color:var(--ok);margin-top:1px}
.privacy b{color:var(--fg)}
.batchbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.welcome{display:flex;flex-direction:column;gap:14px}
.welcome .steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.welcome .steps div{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--surface-2)}
.welcome .steps b{font-family:var(--f-display)}
.queue{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gas);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* bill detail */
.overlay{position:fixed;inset:0;background:rgba(8,12,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;margin:0}
.dl div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.dl dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.voci{display:flex;height:18px;border-radius:6px;overflow:hidden;background:var(--chip)}
.voci i{display:block;height:100%}
.verify{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.verify .lamp{width:12px;height:12px;border-radius:50%;flex:none}

/* casa */
.plan{display:flex;flex-direction:column;gap:8px}
.plan .floor{display:flex;gap:6px;align-items:stretch}
.plan .floor .fl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;text-align:center}
.plan .room{border-radius:10px;padding:10px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;border:1.5px solid transparent}
.plan .room b{font-family:var(--f-display);font-size:.95rem;line-height:1.15}
.plan .room span{font-family:var(--f-mono);font-size:.82rem}
.plan .room.z1{background:color-mix(in srgb,var(--luce) 22%,var(--surface));border-color:color-mix(in srgb,var(--luce) 50%,transparent)}
.plan .room.z2{background:color-mix(in srgb,var(--luce-2) 16%,var(--surface));border-color:color-mix(in srgb,var(--luce-2) 45%,transparent)}
.plan .room.z3{background:color-mix(in srgb,var(--gas-2) 18%,var(--surface));border-color:color-mix(in srgb,var(--gas-2) 50%,transparent)}
.plan .room.cold{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);border:1.5px dashed var(--line);color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;position:relative}
.scale .bar div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;color:#10161D}
.scale .marks{position:relative;height:40px}
.scale .mk{position:absolute;top:0;transform:translateX(-50%);font-size:.74rem;white-space:nowrap;text-align:center;font-weight:600}
.scale .mk::before{content:"";display:block;width:2px;height:10px;background:currentColor;margin:0 auto 2px}
.scale .rng{position:absolute;top:-30px;height:4px;background:var(--fg);border-radius:2px}
.checks{display:flex;flex-direction:column}
.checks .ck{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.checks .ck:last-child{border-bottom:0}
.checks .ck input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.checks .ck .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.checks .ck.done b{text-decoration:line-through;color:var(--muted)}

.emptystate{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.sk{background:linear-gradient(90deg,var(--chip),var(--surface-2),var(--chip));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:8px;height:16px}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:560px){th,td{padding:8px 9px}.panel{padding:14px}.chart{height:240px}}
.chi{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.chi-log{display:flex;flex-direction:column;gap:12px;padding:18px;min-height:280px;max-height:min(62vh,640px);overflow-y:auto}
.msg{max-width:min(78ch,88%);padding:10px 14px;border-radius:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.assistant{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}.msg ul{margin:4px 0 8px;padding-left:20px}.msg li{margin:2px 0}
.chi-empty{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;font-size:.86rem;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--gas)}
.chi-in{display:flex;flex-direction:column;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.chi-in textarea{width:100%;resize:vertical;min-height:52px;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chi-in .controls{justify-content:flex-end}
</style>
